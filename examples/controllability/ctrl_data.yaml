dims:
  states: 2
  inputs: 2
  observations: 2
  parameters: 0

x0:
  kind: uniform
  params:
    bounds:
      - [-2.5, 2.5]
      - [-5.0, 5.0]

control:
  kind: chirp
  params:
    t1: 6.0
    freq_range: [0.05, 0.6]  # Covers below and above natural frequencies
    amp_range: [1.0, 3.0]
    method: linear

solver:
  method: "RK45"
  rtol: 1.0e-6
  atol: 1.0e-8

postprocess:
  n_skip: 0
  shift_t: false
